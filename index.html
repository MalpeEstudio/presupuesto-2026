<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Presupuestos - Malpe Estudio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .form-section {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        
        .preview-section {
            background: white;
            padding: 0;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            overflow: hidden;
            max-height: 900px;
            display: flex;
            flex-direction: column;
        }
        
        .preview-scroll {
            overflow-y: auto;
            flex: 1;
            background: #f5f5f5;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 13px;
        }
        
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #6633ff;
            box-shadow: 0 0 0 3px rgba(102,51,255,0.1);
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s;
        }
        
        .btn-add {
            background: #43b08b;
            color: white;
            width: 100%;
            margin-bottom: 10px;
        }
        
        .btn-add:hover {
            background: #2d9b77;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(67,176,139,0.3);
        }
        
        .btn-download {
            background: linear-gradient(135deg, #6633ff 0%, #764ba2 100%);
            color: white;
            width: 100%;
            padding: 12px 16px;
            font-weight: 700;
        }
        
        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102,51,255,0.4);
        }
        
        .btn-remove {
            background: #ff6b6b;
            color: white;
            padding: 8px 12px;
            font-size: 12px;
        }
        
        .btn-remove:hover {
            background: #ff5252;
        }
        
        .services-list {
            margin-bottom: 20px;
        }
        
        .service-item {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 4px solid #6633ff;
        }

        .calculator-box {
            background: #f0f4ff;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 3px solid #6633ff;
        }

        .calculator-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .calculator-result {
            background: white;
            padding: 8px;
            border-radius: 4px;
            text-align: right;
            font-weight: 600;
            color: #6633ff;
            font-size: 13px;
        }
        
        /* ==================== PDF TEMPLATE ==================== */
        #pdf-content {
            width: 210mm;
            height: 297mm;
            background: #fff;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #111;
            overflow: hidden;
        }

        .pdf-header {
            position: relative;
            height: 71mm;
            min-height: 71mm;
            padding: 0;
            color: #fff;
            background:
                radial-gradient(circle at 72% 34%, rgba(116,48,255,.55), transparent 34%),
                linear-gradient(108deg, #050505 0%, #0a0712 28%, #2d155c 58%, #7430ff 100%);
            overflow: hidden;
        }

        .pdf-header::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(0,0,0,.05) 0%, rgba(0,0,0,0) 46%, rgba(116,48,255,.10) 100%);
            pointer-events: none;
        }

        .pdf-header-left {
            position: absolute;
            top: 17mm;
            left: 16mm;
            display: flex;
            align-items: center;
            gap: 4mm;
            z-index: 1;
        }

        .pdf-header-logo {
            height: 15mm;
            width: auto;
            display: block;
        }

        .pdf-header-branding div:first-child {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.05;
            letter-spacing: .15px;
        }

        .pdf-header-branding div:last-child {
            margin-top: 1px;
            font-size: 17px;
            font-weight: 300;
            line-height: 1.05;
            color: #fff;
            opacity: .95;
        }

        .pdf-header-title {
            position: absolute;
            left: 16mm;
            bottom: 15mm;
            z-index: 1;
        }

        .pdf-header-title div:first-child {
            font-size: 38px;
            font-weight: 800;
            line-height: .95;
            letter-spacing: -.7px;
            margin: 0 0 3mm 0;
        }

        .pdf-header-title div:last-child {
            font-size: 18px;
            color: #01ae89;
            font-weight: 400;
            line-height: 1;
        }

        .pdf-header-contact {
            position: absolute;
            right: 12mm;
            top: 33mm;
            text-align: right;
            font-size: 11.5px;
            line-height: 1.27;
            color: #fff;
            z-index: 1;
        }

        .pdf-header-contact div:first-child {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0;
        }

        .pdf-header-contact a {
            color: #fff;
            text-decoration: none;
        }

        .pdf-body {
            padding: 9mm 11.5mm 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
            min-height: 0;
        }

        .cliente-section {
            margin: 0 0 6mm 0;
            background: #f2f2f2;
            padding: 5.5mm 10mm;
            border-left: 2mm solid #7430ff;
            min-height: 20mm;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .cliente-label {
            font-size: 11px;
            font-weight: 500;
            color: #7430ff;
            text-transform: uppercase;
            letter-spacing: .2px;
            margin-bottom: 2mm;
        }

        .cliente-name {
            font-size: 18px;
            line-height: 1.05;
            font-weight: 800;
            color: #111;
            text-transform: uppercase;
        }

        .cliente-info {
            font-size: 10.5px;
            color: #555;
            margin-top: 2mm;
        }

        .services-table {
            width: 100%;
            margin: 0 0 6mm 0;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .table-header {
            background: linear-gradient(90deg, #7430ff 0%, #3564d8 48%, #01ae89 100%);
        }

        .table-header th {
            padding: 4mm 5mm;
            text-align: left;
            font-size: 11.5px;
            line-height: 1;
            font-weight: 500;
            color: #fff;
            border: 0;
        }

        .table-header th:nth-child(2),
        .table-header th:nth-child(3),
        .table-header th:nth-child(4) {
            text-align: right;
        }

        .table-body td {
            padding: 4.1mm 5mm;
            border-bottom: 0;
            font-size: 11.5px;
            line-height: 1.28;
            color: #111;
            vertical-align: top;
        }

        .table-body td strong {
            font-weight: 400;
        }

        .table-body td:nth-child(2),
        .table-body td:nth-child(3),
        .table-body td:nth-child(4) {
            text-align: right;
            white-space: nowrap;
        }

        .table-body tr.service-with-notes td {
            padding-bottom: 1mm;
        }

        .table-body tr.notes-row td {
            border-bottom: 0;
            padding-top: 0;
            padding-bottom: 3mm;
            font-size: 9.8px;
            color: #666;
            font-weight: 400;
        }

        .totals-section {
            margin: 0 0 7mm 0;
            display: flex;
            justify-content: flex-end;
        }

        .totals-box {
            width: 30%;
            min-width: 52mm;
            padding: 0 5mm 0 0;
            background: transparent;
            border: 0;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            gap: 7mm;
            padding: 2mm 0;
            font-size: 11px;
            line-height: 1.1;
        }

        .total-row.subtotal,
        .total-row.iva {
            color: #111;
            border: 0;
        }

        .total-row.final {
            margin-top: 1mm;
            padding-top: 3mm;
            padding-bottom: 0;
            font-weight: 800;
            font-size: 11.5px;
            color: #000;
            border: 0;
        }

        .total-value {
            font-weight: 400;
            min-width: 24mm;
            text-align: right;
        }

        .total-row.final .total-value {
            font-weight: 800;
        }

        .observaciones-section {
            margin: auto 0 0 0;
            min-height: 21mm;
            padding: 5mm 10mm;
            background: linear-gradient(90deg, rgba(116,48,255,.08) 0%, rgba(1,174,137,.09) 100%);
            border-left: 2mm solid #01ae89;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .observaciones-title {
            color: #01ae89;
            font-weight: 500;
            margin-bottom: 1.5mm;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .15px;
        }

        .observaciones-text {
            color: #111;
            font-size: 10.5px;
            line-height: 1.35;
            text-transform: uppercase;
        }

        .pdf-footer {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10mm;
            min-height: 40mm;
            padding: 12mm 10.5mm 8mm;
            margin-top: 10mm;
            background: #f2f2f2;
            border-top: 0;
            align-items: start;
        }

        .footer-box {
            font-size: 10px;
        }

        .footer-box:nth-child(2),
        .footer-box:nth-child(3) {
            text-align: center;
        }

        .footer-box h4 {
            color: #111;
            font-weight: 800;
            margin-bottom: 3mm;
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: 0;
        }

        .footer-box p {
            color: #111;
            line-height: 1.25;
            font-weight: 400;
            font-size: 10px;
        }

        .empty-state {
            padding: 24mm 5mm;
            text-align: center;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- FORMULARIO -->
        <div class="form-section">
            <h1>📋 Generador de Presupuestos</h1>
            
            <div class="form-group">
                <label>Nombre del cliente</label>
                <input type="text" id="clientName" placeholder="Ej: Acme Corporation" onchange="updatePreview()">
            </div>

            <div class="form-group">
                <label>Información extra (proyecto, expediente, etc.)</label>
                <input type="text" id="clientInfo" placeholder="Ej: Proyecto ABC / Expediente nº 2024-001" onchange="updatePreview()">
            </div>
            
            <div class="form-group">
                <label>Observaciones</label>
                <textarea id="notes" placeholder="Notas, condiciones especiales..." onchange="updatePreview()"></textarea>
            </div>

            <div class="form-group">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="showSubtotal" checked onchange="updatePreview()" style="cursor: pointer; width: auto;">
                    <span>Mostrar subtotal en el presupuesto</span>
                </label>
            </div>
            
            <h2 style="font-size: 16px; color: #333; margin-top: 30px; margin-bottom: 15px;">Servicios</h2>
            
            <div class="services-list" id="servicesList"></div>
            
            <button class="btn-add" onclick="addService()">+ Agregar Servicio</button>
            
            <button class="btn-download" onclick="downloadPDF()">📥 Descargar Presupuesto</button>
        </div>
        
        <!-- PREVIEW PDF -->
        <div class="preview-section">
            <div class="preview-scroll" id="previewScroll">
                <div id="pdf-content"></div>
            </div>
        </div>
    </div>

        let services = [];
        
        function addService() {
            services.push({
                id: Date.now(),
                description: '',
                notes: '',
                quantity: 1,
                people: 1,
                hours: 1,
                hourlyRate: 50,
                price: 50,
                useQuantity: false
            });
            renderServices();
        }
        
        function removeService(id) {
            services = services.filter(s => s.id !== id);
            renderServices();
        }
        
        function updateService(id, field, value) {
            const service = services.find(s => s.id === id);
            if (service) {
                if (field === 'useQuantity') {
                    service[field] = value;
                    if (!value) {
                        service.quantity = 1;
                    }
                } else if (['quantity', 'people', 'hours', 'hourlyRate'].includes(field)) {
                    service[field] = parseFloat(value) || 0;
                } else {
                    service[field] = value;
                }
                
                // SIEMPRE recalcular precio
                service.price = (service.people || 1) * (service.hours || 1) * (service.hourlyRate || 0);
                
                renderServices();
            }
        }
        
        function renderServices() {
            const list = document.getElementById('servicesList');
            list.innerHTML = services.map(service => {
                const precioCalculado = (service.people || 1) * (service.hours || 1) * (service.hourlyRate || 0);
                return `
                <div class="service-item">
                    <div class="form-group">
                        <label>Descripción del servicio</label>
                        <input type="text" 
                            value="${service.description}" 
                            placeholder="Ej: Diseño de logo, Página web, Redes sociales..."
                            onchange="updateService(${service.id}, 'description', this.value)">
                    </div>

                    <div class="form-group">
                        <label>Notas del servicio (opcional)</label>
                        <textarea 
                            placeholder="Notas específicas, detalles técnicos, especificaciones..."
                            style="min-height: 60px;"
                            onchange="updateService(${service.id}, 'notes', this.value)">${service.notes || ''}</textarea>
                    </div>
                    
                    <div class="calculator-box">
                        <label style="font-weight: 700; margin-bottom: 8px; display: block; font-size: 12px;">Calculadora de precio</label>
                        <div class="calculator-grid">
                            <div>
                                <label style="font-size: 11px;">Personas</label>
                                <input type="number" 
                                    value="${service.people || 1}" 
                                    min="1"
                                    step="1"
                                    onchange="updateService(${service.id}, 'people', this.value)">
                            </div>
                            <div>
                                <label style="font-size: 11px;">Horas</label>
                                <input type="number" 
                                    value="${service.hours || 1}" 
                                    min="0.5"
                                    step="0.5"
                                    onchange="updateService(${service.id}, 'hours', this.value)">
                            </div>
                            <div>
                                <label style="font-size: 11px;">€/Hora</label>
                                <input type="number" 
                                    value="${service.hourlyRate || 50}" 
                                    min="0"
                                    step="0.01"
                                    onchange="updateService(${service.id}, 'hourlyRate', this.value)">
                            </div>
                        </div>
                        <div class="calculator-result">
                            Precio calculado: ${precioCalculado.toFixed(2)}€
                        </div>
                    </div>

                    <div class="form-group">
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="checkbox" 
                                ${service.useQuantity ? 'checked' : ''} 
                                onchange="updateService(${service.id}, 'useQuantity', this.checked)"
                                style="cursor: pointer; width: auto;">
                            <span>Agregar cantidad</span>
                        </label>
                    </div>

                    ${service.useQuantity ? `
                        <div class="form-group">
                            <label>Cantidad</label>
                            <input type="number" 
                                value="${service.quantity || 1}" 
                                min="1"
                                step="1"
                                onchange="updateService(${service.id}, 'quantity', this.value)">
                        </div>
                    ` : ''}

                    <button class="btn-remove" onclick="removeService(${service.id})" style="width: 100%;">✕ Eliminar servicio</button>
                </div>
                `;
            }).join('');
            
            updatePreview();
        }
        
        function updatePreview() {
            const clientName = document.getElementById('clientName').value || 'NOMBRE DE EMPRESA';
            const clientInfo = document.getElementById('clientInfo').value;
            const notes = document.getElementById('notes').value;
            const showSubtotal = document.getElementById('showSubtotal').checked;
            
            const subtotal = services.reduce((sum, s) => sum + (s.quantity * s.price), 0);
            const iva = subtotal * 0.21;
            const total = subtotal + iva;
            
            let html = `
                <div class="pdf-header">
                    <div class="pdf-header-left">
                        <img src="${logoBase64}" alt="Malpe Estudio" class="pdf-header-logo">
                    </div>
                    <div class="pdf-header-title">
                        <div>PRESUPUESTO</div>
                        <div>Propuesta de servicios</div>
                    </div>
                    <div class="pdf-header-contact">
                        <div>Malpe Estudio</div>
                        <div>80075258E</div>
                        <div>Vicente Barrantes 8B</div>
                        <div>06002, Badajoz</div>
                        <div>662620882</div>
                        <div><a href="mailto:info@malpeestudio.com">info@malpeestudio.com</a></div>
                        <div><a href="https://malpeestudio.com">malpeestudio.com</a></div>
                    </div>
                </div>
                
                <div class="pdf-body">
                    <div class="cliente-section">
                        <div class="cliente-label">Cliente</div>
                        <div class="cliente-name">${clientName}</div>
                        ${clientInfo ? `<div class="cliente-info">${clientInfo}</div>` : ''}
                    </div>
            `;
            
            if (services.length > 0) {
                const hayAlgunConCantidad = services.some(s => s.useQuantity);
                
                html += `
                    <table class="services-table">
                        <thead class="table-header">
                            <tr>
                                <th style="width: 50%;">DESCRIPCIÓN</th>
                                ${hayAlgunConCantidad ? '<th style="width: 15%; text-align: right;">CANTIDAD</th>' : ''}
                                <th style="width: 15%; text-align: right;">PRECIO</th>
                                <th style="width: 20%; text-align: right;">TOTAL</th>
                            </tr>
                        </thead>
                        <tbody class="table-body">
                `;
                
                services.forEach((s, index) => {
                    const lineTotal = (s.quantity * s.price).toFixed(2);
                    const tieneNotas = s.notes ? true : false;
                    
                    html += `
                        <tr ${tieneNotas ? 'class="service-with-notes"' : ''}>
                            <td>
                                <strong>${s.description || '—'}</strong>
                            </td>
                            ${hayAlgunConCantidad ? `<td style="text-align: right;">${s.useQuantity ? s.quantity : '#'}</td>` : ''}
                            <td style="text-align: right;">${s.price.toFixed(2)}€</td>
                            <td style="text-align: right;">${lineTotal}€</td>
                        </tr>
                    `;
                    
                    if (s.notes) {
                        html += `
                            <tr class="notes-row">
                                <td colspan="${hayAlgunConCantidad ? 4 : 3}">
                                    ${s.notes.replace(/\n/g, '<br>')}
                                </td>
                            </tr>
                        `;
                    }
                });
                
                html += `</tbody></table>`;
            } else {
                html += `<div class="empty-state">Agrega servicios en el formulario</div>`;
            }
            
            if (showSubtotal) {
                html += `
                    <div class="totals-section">
                        <div class="totals-box">
                            <div class="total-row subtotal">
                                <span>Subtotal</span>
                                <span class="total-value">${subtotal.toFixed(2)}€</span>
                            </div>
                            <div class="total-row iva">
                                <span>IVA (21%)</span>
                                <span class="total-value">${iva.toFixed(2)}€</span>
                            </div>
                            <div class="total-row final">
                                <span>TOTAL</span>
                                <span class="total-value">${total.toFixed(2)}€</span>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            if (notes) {
                html += `
                    <div class="observaciones-section">
                        <div class="observaciones-title">OBSERVACIONES</div>
                        <div class="observaciones-text">${notes}</div>
                    </div>
                `;
            }
            
            html += `
                </div>
                
                <div class="pdf-footer">
                    <div class="footer-box">
                        <h4>Condiciones de pago</h4>
                        <p>60% en la aceptación<br>40% en la entrega</p>
                    </div>
                    <div class="footer-box">
                        <h4>Validez del presupuesto</h4>
                        <p>30 días desde la entrega<br>al cliente</p>
                    </div>
                    <div class="footer-box">
                        <h4>Impuestos no incluidos</h4>
                        <p>Al total entregado habrá que<br>agregar el IVA correspondiente</p>
                    </div>
                </div>
            `;
            
            document.getElementById('pdf-content').innerHTML = html;
        }
        
        async function downloadPDF() {
            if (services.length === 0) {
                alert('⚠️ Agrega al menos un servicio para generar el presupuesto');
                return;
            }

            const clientName = document.getElementById('clientName').value || 'cliente';
            const element = document.getElementById('pdf-content');
            const button = document.querySelector('.btn-download');
            const originalText = button.innerHTML;

            try {
                button.disabled = true;
                button.innerHTML = '⏳ Generando PDF...';

                if (typeof html2canvas !== 'function') {
                    // Fallback: usar html2pdf directamente si html2canvas no está expuesto globalmente
                    if (typeof html2pdf === 'function') {
                        const fallbackOpt = {
                            margin: [0, 0, 0, 0],
                            filename: `presupuesto-${clientName.toLowerCase().replace(/\s+/g, '-')}.pdf`,
                            image: { type: 'jpeg', quality: 0.98 },
                            html2canvas: { scale: 2, useCORS: true, logging: false, backgroundColor: '#ffffff' },
                            jsPDF: { orientation: 'portrait', unit: 'mm', format: 'a4' }
                        };
                        await html2pdf().set(fallbackOpt).from(element).save();
                        return;
                    }
                    throw new Error('No se pudo cargar html2canvas');
                }
                if (!(window.jspdf && window.jspdf.jsPDF)) {
                    throw new Error('No se pudo cargar jsPDF');
                }

                const images = Array.from(element.querySelectorAll('img'));
                await Promise.all(images.map(img => {
                    if (img.complete) return Promise.resolve();
                    return new Promise(resolve => {
                        img.onload = resolve;
                        img.onerror = resolve;
                    });
                }));

                const canvas = await html2canvas(element, {
                    scale: 2,
                    useCORS: true,
                    logging: false,
                    backgroundColor: '#ffffff',
                    width: element.scrollWidth,
                    height: element.scrollHeight,
                    scrollX: 0,
                    scrollY: 0,
                    windowWidth: element.scrollWidth,
                    windowHeight: element.scrollHeight
                });

                const imgData = canvas.toDataURL('image/jpeg', 0.98);
                const { jsPDF } = window.jspdf;

                const pdf = new jsPDF({
                    orientation: 'portrait',
                    unit: 'mm',
                    format: 'a4',
                    compress: true
                });

                pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
                pdf.save(`presupuesto-${clientName.toLowerCase().replace(/\s+/g, '-')}.pdf`);
            } catch (error) {
                console.error(error);
                alert('No se pudo generar el PDF: ' + (error && error.message ? error.message : error));
            } finally {
                button.disabled = false;
                button.innerHTML = originalText;
            }
        }
        
        // Inicializar
        addService();
    </script>
</body>
</html>
